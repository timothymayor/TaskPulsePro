name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-validate:
    name: Security Audit & Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high || echo "Vulnerability audit completed with notes"

      - name: Build production bundle
        run: npm run build

      - name: Verify build artifact integrity
        run: |
          test -d dist || { echo "dist folder missing"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          echo "Build integrity check passed."

  deploy-preview:
    name: Deploy Vercel Preview
    needs: audit-and-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Preview)
        run: |
          echo "Preview deployment target configured for Vercel."
        # If VERCEL_TOKEN secret is provided:
        # uses: amondnet/vercel-action@v25
        # with:
        #   vercel-token: ${{ secrets.VERCEL_TOKEN }}
        #   vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        #   vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        #   github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    name: Deploy to Vercel Production
    needs: audit-and-validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        run: |
          echo "Production deployment target configured for Vercel."
        # If VERCEL_TOKEN secret is provided:
        # uses: amondnet/vercel-action@v25
        # with:
        #   vercel-token: ${{ secrets.VERCEL_TOKEN }}
        #   vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        #   vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        #   vercel-args: '--prod'
